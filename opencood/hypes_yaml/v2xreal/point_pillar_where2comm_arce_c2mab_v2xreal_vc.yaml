name: point_pillar_where2comm_arce_c2mab_v2xreal_vc
root_dir: /data/v2xreal/train
validate_dir: /data/v2xreal/validate
dataset_mode: vc
wild_setting:
  async: false
  async_mode: sim
  async_overhead: 100
  seed: 20
  loc_err: false
  xyz_std: 0.2
  ryp_std: 0.2
  data_size: 1.06
  transmission_speed: 27
  backbone_delay: 10
  frame_interval_ms: 100
yaml_parser: load_point_pillar_params
train_params:
  batch_size: 1
  epoches: 20
  eval_freq: 1
  save_freq: 1
  max_cav: 4
fusion:
  core_method: IntermediateFusionDatasetV2XReal
  args:
    cur_ego_pose_flag: false
preprocess:
  core_method: SpVoxelPreprocessor
  args:
    voxel_size:
    - 0.4
    - 0.4
    - 30
    max_points_per_voxel: 32
    max_voxel_train: 64000
    max_voxel_test: 640000
  cav_lidar_range: &id001
  - -102.4
  - -38.4
  - -15
  - 102.4
  - 38.4
  - 15
  num_class: 3
  anchor_generator_config: &id002
  - class_name: vehicle
    anchor_sizes:
    - - 3.9
      - 1.6
      - 1.56
    anchor_rotations:
    - 0
    - 1.57
    anchor_bottom_heights:
    - -1.78
    align_center: true
    feature_map_stride: 2
    matched_threshold: 0.6
    unmatched_threshold: 0.45
  - class_name: pedestrian
    anchor_sizes:
    - - 0.8
      - 0.6
      - 1.73
    anchor_rotations:
    - 0
    - 1.57
    anchor_bottom_heights:
    - -0.6
    align_center: true
    feature_map_stride: 2
    matched_threshold: 0.5
    unmatched_threshold: 0.35
  - class_name: truck
    anchor_sizes:
    - - 8
      - 3
      - 3
    anchor_rotations:
    - 0
    - 1.57
    anchor_bottom_heights:
    - -1.78
    align_center: true
    feature_map_stride: 2
    matched_threshold: 0.6
    unmatched_threshold: 0.45
data_augment:
- NAME: random_world_flip
  ALONG_AXIS_LIST:
  - x
- NAME: random_world_rotation
  WORLD_ROT_ANGLE:
  - -0.78539816
  - 0.78539816
- NAME: random_world_scaling
  WORLD_SCALE_RANGE:
  - 0.95
  - 1.05
postprocess:
  core_method: VoxelPostprocessorV2XReal
  anchor_args:
    cav_lidar_range: *id001
    num: 2
    anchor_generator_config: *id002
  target_args:
    score_threshold: 0.2
  order: hwl
  max_num: 200
  nms_thresh: 0.15
model:
  core_method: point_pillar_where2comm_arce_v2xreal
  args:
    voxel_size:
    - 0.4
    - 0.4
    - 30
    lidar_range:
    - -102.4
    - -38.4
    - -15
    - 102.4
    - 38.4
    - 15
    anchor_number: 2
    anchor_num: 2
    head_dim: 256
    max_cav: 4
    num_class: 3
    compression: 0
    backbone_fix: false
    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters:
      - 64
    point_pillar_scatter:
      num_features: 64
    base_bev_backbone:
      layer_nums:
      - 3
      - 5
      - 8
      layer_strides:
      - 2
      - 2
      - 2
      num_filters:
      - 64
      - 128
      - 256
      upsample_strides:
      - 1
      - 2
      - 4
      num_upsample_filter:
      - 128
      - 128
      - 128
    shrink_header:
      kernal_size:
      - 3
      stride:
      - 1
      padding:
      - 1
      dim:
      - 256
      input_dim: 384
    where2comm_fusion:
      fully: false
      voxel_size:
      - 0.4
      - 0.4
      - 30
      downsample_rate: 4
      in_channels: 256
      multi_scale: true
      layer_nums:
      - 3
      - 5
      - 8
      num_filters:
      - 64
      - 128
      - 256
      communication:
        round: 1
        threshold: 0.01
        gaussian_smooth:
          k_size: 5
          c_sigma: 1.0
    arce:
      enabled: true
      mode: dc2mab
      policy: dc2mab_sender_ego
      link_scope: non_ego
      seed: 2026
      action_space:
        type: final_36
        send:
        - 0
        - 1
        send_values:
        - 0
        - 1
        quant:
        - fp16
        - int8
        - int4
        quant_modes:
        - fp16
        - int8
        - int4
        rho:
        - 0.0
        - 0.25
        - 0.5
        redundancy_ratios:
        - 0.0
        - 0.25
        - 0.5
        cache:
        - 0
        - 1
        cache_values:
        - 0
        - 1
        proposal_send_only: true
        fec_main: raptor_sim
        fec_mode: raptor_sim
        xor_group_size: 4
        decode_overhead: 0.0
      context:
        dim: 7
        use_complementarity: false
        normalize_bandwidth_by_mbps: 27.0
        normalize_delay_by_ms: 100.0
        b_max_mbps: 27.0
        stale_max_ms: 100.0
        confidence_threshold: 0.3
        include_cav_confidence: true
      c2mab:
        context_dim: 7
        ridge_lambda: 1.0
        lambda_reg: 1.0
        discount: 0.97
        exploration_beta: 1.0
        beta: 1.0
        update_feedback: link_proxy_reward
      reward:
        type: final_proxy
        topk_confidence: 20
        confidence_threshold: 0.3
        alpha_q: 0.5
        alpha_cost: 0.3
        alpha_c: 0.3
        alpha_delay: 0.2
        alpha_d: 0.2
        alpha_violation: 1.0
        alpha_v: 1.0
        tau_stale_ms: 300.0
        stale_norm_ms: 100.0
        stale_max_ms: 100.0
        q_min: 0.3
      ego_oracle:
        type: diversity_greedy_knapsack
        budget_scope: global_sum_link
        budget_source: channel_profiles
        max_budget_cavs: 4
        lambda_comp: 0.0
        lambda_red: 0.0
        eps: 1.0e-06
      delay:
        policy_by_state:
          good: current
          medium: current
          bad: previous_frame
      scheduler:
        fps: 10
        tx_window_ms: 100.0
        frame_interval_ms: 100.0
        budget_source: channel_profiles
        budget_scope: global_sum_link
        per_link_budget: false
      packetizer:
        mode: byte_stream
        packet_size_bytes: 1024
        Lp: 1024
        quantize_first: true
        flatten_after_quantization: true
        pad_last_packet: true
      patch_selection:
        enabled: false
        source: none
        patch_selector: none
        ranking: none
        enforce_link_budget: false
      latency:
        enabled: true
        model: fixed_state_delay
        deadline_ms: 100.0
        frame_interval_ms: 100.0
        proc_delay_ms: 0.0
        late_policy: state_temporal_policy
        tau_stale_ms: 100.0
        policy_by_state:
          good: current
          medium: current
          bad: previous_frame
      fec:
        enabled: true
        type: action
        default_type: raptor_sim
        apply_to: byte_stream_packets
        apply_to_selected_packets_only: false
        xor_group_size: 4
        decode_overhead: 0.0
      redundancy:
        enabled: true
        ratios:
        - 0.0
        - 0.25
        - 0.5
        parity_rule: ceil_source_packets_times_rho
      recovery: arce
      temporal_fusion:
        enabled: true
        beta: 5.0
        tau_stale_ms: 100.0
        use_delay_penalty: true
        update_rule: recv_bernoulli_cache
      metrics:
        save_frame_records: true
        save_link_records: true
        save_detection_state_index: true
        success_q_min: 0.3
        success_min_effective_patch_ratio: 0.0
      profiles:
        good: {}
        medium: {}
        bad: {}
      recovery_priority: &id003
      - temporal_cache
      - spatial_interpolation
      - zero_fill
      fixed_policy:
        enabled: true
        recovery: arce
        recovery_priority: *id003
        profiles:
          good:
            quant_mode: fp16
            fec_type: none
            redundancy_ratio: 0.0
            xor_group_size: 4
            decode_overhead: 0.0
          medium:
            quant_mode: int8
            fec_type: xor
            redundancy_ratio: 0.25
            xor_group_size: 4
            decode_overhead: 0.0
          bad:
            quant_mode: int4
            fec_type: raptor_sim
            redundancy_ratio: 0.5
            xor_group_size: 4
            decode_overhead: 0.0
loss:
  core_method: point_pillar_loss_v2xreal
  args:
    cls_weight: 1.0
    reg: 2.0
    num_class: 3
optimizer:
  core_method: Adam
  lr: 0.001
  args:
    eps: 1e-10
    weight_decay: 1e-4
lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size:
  - 15
  - 50
communication_environment:
  enabled: true
  strict: true
  seed: 2026
  channel:
    mode: markov
    initial_state: medium
    frame_interval_ms: 100.0
    loss_model: bernoulli
    transition_matrix:
      good:
        good: 0.85
        medium: 0.13
        bad: 0.02
      medium:
        good: 0.1
        medium: 0.8
        bad: 0.1
      bad:
        good: 0.03
        medium: 0.17
        bad: 0.8
    bernoulli_loss_rates:
      good: 0.05
      medium: 0.2
      bad: 0.35
    profiles:
      good:
        bandwidth_mbps: 27.0
        packet_loss_rate: 0.05
        delay_ms: 10.0
        temporal_source: current
      medium:
        bandwidth_mbps: 5.0
        packet_loss_rate: 0.2
        delay_ms: 50.0
        temporal_source: current
      bad:
        bandwidth_mbps: 1.0
        packet_loss_rate: 0.35
        delay_ms: 100.0
        temporal_source: previous_frame
  latency:
    enabled: true
    frame_interval_ms: 100.0
