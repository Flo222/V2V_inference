name: point_pillar_cosdh_v2xreal_vc
root_dir: /data/v2xreal/train
validate_dir: /data/v2xreal/validate
dataset_mode: vc
wild_setting:
  async: false
  async_mode: sim
  async_overhead: 100
  seed: 25
  loc_err: false
  xyz_std: 0.2
  ryp_std: 0.2
  data_size: 1.06
  transmission_speed: 27
  backbone_delay: 10
yaml_parser: load_point_pillar_params
train_params:
  batch_size: 1
  epoches: 20
  eval_freq: 2
  save_freq: 2
  max_cav: 4
fusion:
  core_method: IntermediateFusionDatasetV2XReal
  args:
    cur_ego_pose_flag: false
preprocess:
  core_method: SpVoxelPreprocessor
  args:
    voxel_size: &voxel_size
    - 0.4
    - 0.4
    - 30
    max_points_per_voxel: 32
    max_voxel_train: 64000
    max_voxel_test: 640000
  cav_lidar_range: &cav_lidar_range
  - -102.4
  - -38.4
  - -15
  - 102.4
  - 38.4
  - 15
  num_class: 3
  anchor_generator_config: &anchor_generator_config
  - class_name: vehicle
    anchor_sizes:
    - - 3.9
      - 1.6
      - 1.56
    anchor_rotations:
    - 0
    - 1.57
    anchor_bottom_heights:
    - -1.78
    align_center: true
    feature_map_stride: 2
    matched_threshold: 0.6
    unmatched_threshold: 0.45
  - class_name: pedestrian
    anchor_sizes:
    - - 0.8
      - 0.6
      - 1.73
    anchor_rotations:
    - 0
    - 1.57
    anchor_bottom_heights:
    - -0.6
    align_center: true
    feature_map_stride: 2
    matched_threshold: 0.5
    unmatched_threshold: 0.35
  - class_name: truck
    anchor_sizes:
    - - 8
      - 3
      - 3
    anchor_rotations:
    - 0
    - 1.57
    anchor_bottom_heights:
    - -1.78
    align_center: true
    feature_map_stride: 2
    matched_threshold: 0.6
    unmatched_threshold: 0.45
data_augment:
- NAME: random_world_flip
  ALONG_AXIS_LIST:
  - x
- NAME: random_world_rotation
  WORLD_ROT_ANGLE:
  - -0.78539816
  - 0.78539816
- NAME: random_world_scaling
  WORLD_SCALE_RANGE:
  - 0.95
  - 1.05
postprocess:
  core_method: VoxelPostprocessorV2XReal
  anchor_args:
    cav_lidar_range: *cav_lidar_range
    num: 2
    anchor_generator_config: *anchor_generator_config
  target_args:
    score_threshold: 0.2
  order: hwl
  max_num: 200
  nms_thresh: 0.15
model:
  core_method: point_pillar_cosdh_v2xreal
  args:
    voxel_size: *voxel_size
    lidar_range: *cav_lidar_range
    anchor_number: 2
    anchor_num: 2
    num_class: 3
    max_cav: 4
    backbone_fix: false
    supervise_single: false
    req_points_threshold: 4
    compression: 16
    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters:
      - 64
    point_pillar_scatter:
      num_features: 64
    base_bev_backbone:
      layer_nums:
      - 3
      - 5
      - 8
      layer_strides:
      - 2
      - 2
      - 2
      num_filters:
      - 64
      - 128
      - 256
      upsample_strides:
      - 1
      - 2
      - 4
      num_upsample_filter:
      - 128
      - 128
      - 128
      voxel_size: *voxel_size
    feat_dim:
    - 64
    - 128
    - 256
    shrink_header:
      kernal_size:
      - 3
      stride:
      - 1
      padding:
      - 1
      dim:
      - 256
      input_dim: 384
    where2comm:
      fully: false
      fusion: max
      communication:
        threshold: 0.01
        gaussian_smooth:
          k_size: 5
          c_sigma: 1.0
loss:
  core_method: point_pillar_loss_v2xreal
  args:
    cls_weight: 1.0
    reg: 2.0
    num_class: 3
optimizer:
  core_method: Adam
  lr: 0.001
  args:
    eps: 1e-10
    weight_decay: 1e-4
lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size:
  - 15
  - 50
