name: point_pillar_diffstudent_markov_v2xreal_vc
root_dir: /data/v2xreal/train
validate_dir: /data/v2xreal/validate
dataset_mode: vc
wild_setting:
  async: false
  async_mode: sim
  async_overhead: 100
  seed: 25
  loc_err: false
  xyz_std: 0.2
  ryp_std: 0.2
  data_size: 1.06
  transmission_speed: 27
  backbone_delay: 10
yaml_parser: load_point_pillar_params
train_params:
  batch_size: 1
  epoches: 20
  eval_freq: 2
  save_freq: 2
  max_cav: 4
  late_loss_weight: 10.0
fusion:
  core_method: IntermediateFusionDatasetCoopdiffV2XReal
  args:
    cur_ego_pose_flag: false
preprocess:
  core_method: SpVoxelPreprocessor
  args:
    voxel_size: &id003
    - 0.4
    - 0.4
    - 30
    max_points_per_voxel: 32
    max_voxel_train: 64000
    max_voxel_test: 640000
  cav_lidar_range: &id001
  - -102.4
  - -38.4
  - -15
  - 102.4
  - 38.4
  - 15
  num_class: 3
  anchor_generator_config: &id002
  - class_name: vehicle
    anchor_sizes:
    - - 3.9
      - 1.6
      - 1.56
    anchor_rotations:
    - 0
    - 1.57
    anchor_bottom_heights:
    - -1.78
    align_center: true
    feature_map_stride: 2
    matched_threshold: 0.6
    unmatched_threshold: 0.45
  - class_name: pedestrian
    anchor_sizes:
    - - 0.8
      - 0.6
      - 1.73
    anchor_rotations:
    - 0
    - 1.57
    anchor_bottom_heights:
    - -0.6
    align_center: true
    feature_map_stride: 2
    matched_threshold: 0.5
    unmatched_threshold: 0.35
  - class_name: truck
    anchor_sizes:
    - - 8
      - 3
      - 3
    anchor_rotations:
    - 0
    - 1.57
    anchor_bottom_heights:
    - -1.78
    align_center: true
    feature_map_stride: 2
    matched_threshold: 0.6
    unmatched_threshold: 0.45
data_augment:
- NAME: random_world_flip
  ALONG_AXIS_LIST:
  - x
- NAME: random_world_rotation
  WORLD_ROT_ANGLE:
  - -0.78539816
  - 0.78539816
- NAME: random_world_scaling
  WORLD_SCALE_RANGE:
  - 0.95
  - 1.05
postprocess:
  core_method: VoxelPostprocessorV2XReal
  anchor_args:
    cav_lidar_range: *id001
    num: 2
    anchor_generator_config: *id002
  target_args:
    score_threshold: 0.2
  order: hwl
  max_num: 200
  nms_thresh: 0.15
model:
  core_method: point_pillar_diff_stu_markov_v2xreal
  args:
    is_train: true
    cav_lidar_range: *id001
    voxel_size: *id003
    lidar_range: *id001
    anchor_number: 2
    anchor_num: 2
    num_class: 3
    head_dim: 256
    max_cav: 4
    compression: 0
    backbone_fix: false
    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters:
      - 64
    point_pillar_scatter:
      num_features: 64
    base_bev_backbone:
      layer_nums: &id004
      - 3
      - 4
      - 5
      layer_strides:
      - 2
      - 2
      - 2
      num_filters: &id005
      - 64
      - 128
      - 256
      upsample_strides:
      - 1
      - 2
      - 4
      num_upsample_filter:
      - 128
      - 128
      - 128
    shrink_header:
      kernal_size:
      - 3
      stride:
      - 1
      padding:
      - 1
      dim:
      - 256
      input_dim: 384
    fusion:
      in_channels: 256
      multi_scale: true
      layer_nums: *id004
      num_filters: *id005
    coopdiff_markov: &id006
      enabled: true
      impair_ego: false
      fps: 10.0
      states:
      - good
      - medium
      - bad
      initial_state: medium
      transition_matrix:
        good:
          good: 0.85
          medium: 0.13
          bad: 0.02
        medium:
          good: 0.1
          medium: 0.8
          bad: 0.1
        bad:
          good: 0.03
          medium: 0.17
          bad: 0.8
      state_profiles:
        good:
          bandwidth_mbps: 27.0
          packet_loss_rate: 0.05
          delay_ms: 10.0
          temporal_source: current
        medium:
          bandwidth_mbps: 5.0
          packet_loss_rate: 0.2
          delay_ms: 50.0
          temporal_source: current
        bad:
          bandwidth_mbps: 1.0
          packet_loss_rate: 0.35
          delay_ms: 100.0
          temporal_source: previous_frame
      packetization:
        packet_size_bytes: 1024
        bytes_per_value: 4
        serialization_order: cell_major
        selection_policy: raster
        send_nonzero_only: false
        nonzero_epsilon: 0.0
        zero_fill_missing: true
      active_scales: null
      verbose: false
loss:
  core_method: point_pillar_loss_v2xreal
  args:
    cls_weight: 1.0
    reg: 2.0
    num_class: 3
optimizer:
  core_method: Adam
  lr: 0.001
  args:
    eps: 1e-10
    weight_decay: 1e-4
lr_scheduler:
  core_method: cosineannealwarm
  epoches: 20
  warmup_lr: 2e-4
  warmup_epoches: 5
  lr_min: 2e-5
coopdiff_markov: *id006
