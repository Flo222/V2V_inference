name: point_pillar_diffteacher_opv2v_e20
root_dir: opv2v_data_dumping/train
validate_dir: opv2v_data_dumping/validate
wild_setting:
  seed: 20
  async: false
  async_mode: sim
  async_overhead: 100
  loc_err: false
  xyz_std: 0.2
  ryp_std: 0.2
  data_size: 1.06
  transmission_speed: 27
  backbone_delay: 10
yaml_parser: load_point_pillar_params
train_params:
  batch_size: 2
  epoches: 20
  eval_freq: 1
  save_freq: 1
  max_cav: 2
fusion:
  core_method: IntermediateFusionDatasetCoopdiff
  args: []
preprocess:
  core_method: SpVoxelPreprocessor
  args:
    voxel_size: &id002
    - 0.4
    - 0.4
    - 4
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
  cav_lidar_range: &id001
  - -140.8
  - -38.4
  - -3
  - 140.8
  - 38.4
  - 1
data_augment:
- NAME: random_world_flip
  ALONG_AXIS_LIST:
  - x
- NAME: random_world_rotation
  WORLD_ROT_ANGLE:
  - -0.78539816
  - 0.78539816
- NAME: random_world_scaling
  WORLD_SCALE_RANGE:
  - 0.95
  - 1.05
postprocess:
  core_method: VoxelPostprocessor
  anchor_args:
    cav_lidar_range: *id001
    l: 3.9
    w: 1.6
    h: 1.56
    r:
    - 0
    - 90
    num: 2
    feature_stride: 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.25
  order: hwl
  max_num: 100
  nms_thresh: 0.15
model:
  core_method: point_pillar_base_multi_scale_teacher_diff
  args:
    is_train: true
    cav_lidar_range: *id001
    voxel_size: *id002
    lidar_range: *id001
    anchor_number: 2
    head_dim: 256
    max_cav: 2
    compression: 0
    backbone_fix: false
    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters:
      - 64
    point_pillar_scatter:
      num_features: 64
    base_bev_backbone:
      layer_nums: &id003
      - 3
      - 4
      - 5
      layer_strides:
      - 2
      - 2
      - 2
      num_filters: &id004
      - 64
      - 128
      - 256
      upsample_strides:
      - 1
      - 2
      - 4
      num_upsample_filter:
      - 128
      - 128
      - 128
    shrink_header:
      kernal_size:
      - 3
      stride:
      - 1
      padding:
      - 1
      dim:
      - 256
      input_dim: 384
    fusion:
      in_channels: 256
      multi_scale: true
      layer_nums: *id003
      num_filters: *id004
loss:
  core_method: point_pillar_loss
  args:
    cls_weight: 1.0
    reg: 2.0
optimizer:
  core_method: Adam
  lr: 0.001
  args:
    eps: 1e-10
    weight_decay: 1e-4
lr_scheduler:
  core_method: cosineannealwarm
  epoches: 20
  warmup_lr: 2e-4
  warmup_epoches: 5
  lr_min: 2e-5
