name: opv2v_cosdh_markov

root_dir: /data/opv2v/train
validate_dir: /data/opv2v/validate
test_dir: /data/opv2v/test
yaml_parser: load_point_pillar_params

train_params:
  batch_size: 2
  epoches: 30
  eval_freq: 5
  save_freq: 1
  max_cav: 5

input_source:
  - lidar
label_type: lidar
comm_range: 70

fusion:
  core_method: intermediate
  dataset: opv2v
  args:
    proj_first: false

preprocess:
  core_method: SpVoxelPreprocessor
  args:
    voxel_size: &voxel_size
      - 0.4
      - 0.4
      - 4
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
    cav_lidar_range: &cav_lidar_range
      - -140.8
      - -38.4
      - -3
      - 140.8
      - 38.4
      - 1

data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST:
      - x
  - NAME: random_world_rotation
    WORLD_ROT_ANGLE:
      - -0.78539816
      - 0.78539816
  - NAME: random_world_scaling
    WORLD_SCALE_RANGE:
      - 0.95
      - 1.05

postprocess:
  core_method: VoxelPostprocessor
  gt_range: *cav_lidar_range
  anchor_args:
    cav_lidar_range: *cav_lidar_range
    l: 3.9
    w: 1.6
    h: 1.56
    r: &anchor_yaw
      - 0
      - 90
    feature_stride: 2
    num: 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: hwl
  max_num: 100
  nms_thresh: 0.15
  dir_args: &dir_args
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *anchor_yaw
  confidence_beta: 0.9
  confidence_threshold: 0.3

model:
  # IMPORTANT: use the Markov-enabled CoSDH model, not plain point_pillar_cosdh.
  core_method: point_pillar_cosdh_markov
  args:
    voxel_size: *voxel_size
    lidar_range: *cav_lidar_range
    anchor_number: 2
    max_cav: 5
    backbone_fix: false
    supervise_single: false
    req_points_threshold: 4
    compression: 16

    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters:
        - 64

    point_pillar_scatter:
      num_features: 64

    base_bev_backbone:
      layer_nums:
        - 3
        - 5
        - 8
      layer_strides:
        - 2
        - 2
        - 2
      num_filters:
        - 64
        - 128
        - 256
      upsample_strides:
        - 1
        - 2
        - 4
      num_upsample_filter:
        - 128
        - 128
        - 128
      voxel_size: *voxel_size

    feat_dim:
      - 64
      - 128
      - 256

    shrink_header:
      kernal_size:
        - 3
      stride:
        - 1
      padding:
        - 1
      dim:
        - 256
      input_dim: 384

    anchor_num: 2

    where2comm:
      fully: false
      fusion: max
      communication:
        threshold: 0.01
      gaussian_smooth:
        k_size: 5
        c_sigma: 1.0

    # CoSDH Markov channel for OPV2V inference.
    # This is consumed by point_pillar_cosdh_markov.py and injected into
    # fusion_in_one_cosdh_markov.Where2comm.
    cosdh_markov:
      enabled: true
      impair_ego: false
      scope: link
      fps: 10
      initial_state: medium
      states:
        - good
        - medium
        - bad
      transition_matrix:
        good:
          good: 0.85
          medium: 0.13
          bad: 0.02
        medium:
          good: 0.10
          medium: 0.80
          bad: 0.10
        bad:
          good: 0.03
          medium: 0.17
          bad: 0.80
      state_profiles:
        good:
          bandwidth_mbps: 27.0
          packet_loss_rate: 0.05
          delay_ms: 10.0
          temporal_source: current
        medium:
          bandwidth_mbps: 5.0
          packet_loss_rate: 0.20
          delay_ms: 50.0
          temporal_source: current
        bad:
          bandwidth_mbps: 1.0
          packet_loss_rate: 0.35
          delay_ms: 100.0
          temporal_source: previous_frame
      packetization:
        packet_size_bytes: 1024
        bytes_per_value: 4
        zero_fill_missing: true
      selection_policy: random
      verbose: true
      debug_first_n_frames: 20

    # Late dense prediction maps also go through Markov damage.
    cosdh_late_markov:
      enabled: true
      share_profile_with_intermediate: true
      verbose: false

    dir_args: *dir_args

loss:
  core_method: point_pillar_loss
  args:
    pos_cls_weight: 2.0
    cls:
      type: SigmoidFocalLoss
      alpha: 0.25
      gamma: 2.0
      weight: 1.0
    reg:
      type: WeightedSmoothL1Loss
      sigma: 3.0
      codewise: true
      weight: 2.0
    dir:
      type: WeightedSoftmaxClassificationLoss
      weight: 0.2
      args: *dir_args

optimizer:
  core_method: Adam
  lr: 0.002
  args:
    eps: 1e-10
    weight_decay: 1e-4

lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size:
    - 10
    - 20
